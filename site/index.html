<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
            name="description"
            content="Учебный сайт для первого CI/CD деплоя"
    >

    <title>Мой первый CI/CD деплой</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
<main class="hero">
    <p class="eyebrow">DEPLOY № 1</p>

    <h1>Сайт опубликован автоматически</h1>

    <p class="lead">
        Код прошёл проверку в GitHub Actions
        и попал на GitHub Pages.
    </p>

    <div class="pipeline" aria-label="Этапы CI/CD">
        <span>Код</span>
        <span aria-hidden="true">→</span>
        <span>Проверка</span>
        <span aria-hidden="true">→</span>
        <span>Деплой</span>
    </div>

    <p class="version">Версия урока: 1.0</p>
</main>
</body>
</html>
